name: migrate-staging

# Manual only per ADR-CI-001 Decision 3. Schema changes are deliberate
# operator decisions, not merge side effects.
on:
  workflow_dispatch: {}

# WIF requires id-token: write. contents: read for checkout.
permissions:
  id-token: write
  contents: read

# One concurrency group per env — prevents two operators from accidentally
# racing a double apply. cancel-in-progress: false keeps a running migration
# from being killed mid-flight; queued dispatches can still be cancelled.
concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to staging via Cloud Build
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repo (for migrate.yaml + source tarball)
        uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/242079866727/locations/global/workloadIdentityPools/cortex-github-pool/providers/cortex-github-provider
          service_account: cortex-ci-submit-staging@sevyn8-cortex-staging.iam.gserviceaccount.com

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit Cloud Build
        run: |
          gcloud builds submit . \
            --region=asia-south1 \
            --config=infra/cloud-build/migrate.yaml \
            --service-account=projects/sevyn8-cortex-staging/serviceAccounts/cortex-ci-migration-staging@sevyn8-cortex-staging.iam.gserviceaccount.com \
            --project=sevyn8-cortex-staging \
            --substitutions=_ENV=staging,_INSTANCE_CONNECTION_NAME=sevyn8-cortex-staging:asia-south1:cortex-staging-postgres,_SECRET_NAME=cortex-db-postgres-break-glass-staging

      - name: Print build console link
        if: always()
        run: |
          echo "View build logs at:"
          echo "https://console.cloud.google.com/cloud-build/builds?project=sevyn8-cortex-staging"
