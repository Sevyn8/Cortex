name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run foundation tests against ephemeral Postgres
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: cortex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: testpw
      PGDATABASE: cortex

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to ephemeral Postgres
        run: pnpm db:migrate

      - name: Strip postgres role privileges for RLS testing (match Cloud SQL)
        run: |
          psql <<'SQL'
          -- Stock Postgres: postgres has rolsuper=true + rolbypassrls=true.
          -- Per PG17 docs, BOTH attributes independently bypass RLS.
          -- Cloud SQL: postgres is "cloudsqlsuperuser" — rolsuper=false +
          -- rolbypassrls=false. FORCE ROW LEVEL SECURITY works there because
          -- the owner is not a real superuser.
          -- Match Cloud SQL behavior in CI: clear both flags so RLS policies
          -- apply to test queries. Must run AFTER migrations — CREATE EXTENSION
          -- vector needs superuser.
          ALTER ROLE postgres NOSUPERUSER NOBYPASSRLS;
          SQL

      - name: Run foundation tests
        run: pnpm test
